<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Input Angka 2 Kolom (Swipe & Button)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 15px;
            border-right: 1px solid #1e293b;
            position: relative;
            touch-action: none; /* Mencegah scroll default saat swipe */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            transition: background 0.1s ease;
        }

        .column:last-child {
            border-right: none;
        }

        .column-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .display-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .value {
            font-size: 5rem;
            font-weight: 700;
            color: #38bdf8;
            margin: 10px 0;
            text-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        .hint {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: 5px;
        }

        .btn {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn:active {
            transform: scale(0.92);
            background-color: #475569;
        }

        .btn-up {
            margin-bottom: 10px;
        }

        .btn-down {
            margin-top: 10px;
        }

        /* Efek visual saat melakukan swipe */
        .column.swiping-up {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
        }

        .column.swiping-down {
            background: linear-gradient(135deg, #831843 0%, #0f172a 100%);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kolom 1 -->
        <div class="column" id="col1">
            <div class="column-title">Kolom 1</div>
            
            <button class="btn btn-up" onclick="changeValue(1, 1)">▲</button>
            
            <div class="display-area">
                <div class="value" id="val1">0</div>
                <div class="hint">Swipe ke atas / bawah di area ini</div>
            </div>
            
            <button class="btn btn-down" onclick="changeValue(1, -1)">▼</button>
        </div>

        <!-- Kolom 2 -->
        <div class="column" id="col2">
            <div class="column-title">Kolom 2</div>
            
            <button class="btn btn-up" onclick="changeValue(2, 1)">▲</button>
            
            <div class="display-area">
                <div class="value" id="val2">0</div>
                <div class="hint">Swipe ke atas / bawah di area ini</div>
            </div>
            
            <button class="btn btn-down" onclick="changeValue(2, -1)">▼</button>
        </div>
    </div>

    <script>
        // State menyimpan nilai masing-masing kolom
        const state = {
            1: 0,
            2: 0
        };

        function changeValue(colId, delta) {
            state[colId] += delta;
            document.getElementById(`val${colId}`).innerText = state[colId];
        }

        // Pengaturan Gesture Swipe per Kolom
        function setupSwipe(colId) {
            const colElement = document.getElementById(`col${colId}`);
            let startY = 0;
            let startX = 0;
            const threshold = 30; // Batas minimal jarak swipe (dalam pixel)

            colElement.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                startX = e.touches[0].clientX;
            }, { passive: true });

            colElement.addEventListener('touchend', (e) => {
                let endY = e.changedTouches[0].clientY;
                let diffY = startY - endY; // Positif jika swipe ke atas, Negatif jika swipe ke bawah

                if (Math.abs(diffY) > threshold) {
                    if (diffY > 0) {
                        // Swipe ke Atas -> Tambah nilai
                        changeValue(colId, 1);
                        flashFeedback(colElement, 'up');
                    } else {
                        // Swipe ke Bawah -> Kurangi nilai
                        changeValue(colId, -1);
                        flashFeedback(colElement, 'down');
                    }
                }
            }, { passive: true });
        }

        // Efek kedip warna singkat saat swipe berhasil terdeteksi
        function flashFeedback(element, direction) {
            const className = direction === 'up' ? 'swiping-up' : 'swiping-down';
            element.classList.add(className);
            setTimeout(() => {
                element.classList.remove(className);
            }, 150);
        }

        // Inisialisasi gestur untuk kedua kolom
        setupSwipe(1);
        setupSwipe(2);
    </script>
</body>
</html>
