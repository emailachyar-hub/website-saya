<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Input Antropometri - Multi Mode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        /* Mode Selector Bar */
        .mode-bar {
            display: flex;
            width: 100%;
            background-color: #07090e;
            padding: 12px 10px;
            gap: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .btn-mode {
            flex: 1;
            padding: 10px 4px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .btn-mode .mode-label {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .btn-mode .mode-sub {
            font-size: 0.65rem;
            opacity: 0.8;
            margin-top: 2px;
            text-align: center;
        }

        .btn-mode.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .container {
            display: flex;
            width: 100%;
            flex: 1;
            overflow: hidden;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding: 10px;
            padding-bottom: 90px;
            border-right: 1px solid #1e293b;
            position: relative;
            touch-action: none;
            background: linear-gradient(180deg, #111827 0%, #0b0f19 100%);
        }

        .column:last-child {
            border-right: none;
        }

        .column-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .roll-container {
            position: relative;
            width: 90%;
            max-width: 220px;
            height: 130px;
            overflow: hidden;
            display: flex;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .roll-drum {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%;
            will-change: transform;
        }

        .roll-item {
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 700;
            color: #1e293b; 
            opacity: 0;
            pointer-events: none;
            width: 100%;
            transition: all 0.15s ease;
        }

        .roll-item.active {
            color: #38bdf8 !important; 
            opacity: 1 !important;
            font-size: 5.2rem; 
            letter-spacing: -2px;
            font-weight: 900;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.9), 0 0 50px rgba(56, 189, 248, 0.4);
        }

        .hint {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: 12px;
        }

        .footer-bar {
            width: 100%;
            padding: 20px;
            background-color: #07090e;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 1px solid #1e293b;
        }

        /* Ukuran tombol diperbesar 2x lipat */
        .btn-save {
            width: 100%;
            max-width: 700px;
            padding: 38px 40px; 
            font-size: 2.6rem;  
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.7);
            touch-action: manipulation;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-save:active {
            transform: scale(0.97);
        }

        .btn-save.unclicked {
            background-color: #ef4444; 
        }

        .btn-save.clicked {
            background-color: #22c55e; 
        }
    </style>
</head>
<body>

    <!-- Pilihan Mode -->
    <div class="mode-bar">
        <button class="btn-mode active" id="btnModeTB" onclick="switchMode('TB')">
            <span class="mode-label">TB / PB</span>
            <span class="mode-sub">Tinggi / Panjang</span>
        </button>
        <button class="btn-mode" id="btnModeBB" onclick="switchMode('BB')">
            <span class="mode-label">BB</span>
            <span class="mode-sub">Berat Badan</span>
        </button>
        <button class="btn-mode" id="btnModeLP" onclick="switchMode('LP')">
            <span class="mode-label">LP</span>
            <span class="mode-sub">Lingkar Kepala</span>
        </button>
    </div>

    <div class="container">
        <div class="column" id="col1">
            <div class="column-title" id="titleCol1">Cm</div>
            <div class="roll-container" id="rollContainer1">
                <div class="roll-drum" id="rollDrum1"></div>
            </div>
            <div class="hint">Swipe / Scroll</div>
        </div>

        <div class="column" id="col2">
            <div class="column-title" id="titleCol2">Mm</div>
            <div class="roll-container" id="rollContainer2">
                <div class="roll-drum" id="rollDrum2"></div>
            </div>
            <div class="hint">Swipe / Scroll</div>
        </div>
    </div>

    <div class="footer-bar">
        <button id="saveBtn" class="btn-save unclicked" onclick="handleSave()">SIMPAN DATA</button>
    </div>

    <script>
        let currentMode = 'TB';

        // Konfigurasi unit dan batas angka per mode
        const modesConfig = {
            'TB': { title1: 'Cm', title2: 'Mm', max1: 250, max2: 9 },
            'BB': { title1: 'Kg', title2: 'Ons', max1: 150, max2: 9 },
            'LP': { title1: 'Cm', title2: 'Mm', max1: 100, max2: 9 }
        };

        // Menyimpan status nilai aktif per mode
        const state = {
            'TB': { 1: 50, 2: 0 },
            'BB': { 1: 3,  2: 0 },
            'LP': { 1: 35, 2: 0 }
        };

        const itemHeight = 130;

        function switchMode(mode) {
            currentMode = mode;

            // Update Tampilan Tombol Mode Active
            document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
            if (mode === 'TB') document.getElementById('btnModeTB').classList.add('active');
            if (mode === 'BB') document.getElementById('btnModeBB').classList.add('active');
            if (mode === 'LP') document.getElementById('btnModeLP').classList.add('active');

            // Update Judul Kolom
            document.getElementById('titleCol1').innerText = modesConfig[mode].title1;
            document.getElementById('titleCol2').innerText = modesConfig[mode].title2;

            // Inisialisasi Ulang Roll
            initRoll(1);
            initRoll(2);
            resetSaveState();
        }

        function initRoll(colId) {
            const drum = document.getElementById(`rollDrum${colId}`);
            drum.innerHTML = '';
            
            const rangeMax = colId === 1 ? modesConfig[currentMode].max1 : modesConfig[currentMode].max2;

            for (let i = 0; i <= rangeMax; i++) {
                const div = document.createElement('div');
                div.className = `roll-item ${i === state[currentMode][colId] ? 'active' : ''}`;
                div.id = `item_${colId}_${i}`;
                div.innerText = i;
                drum.appendChild(div);
            }
            updateRollPosition(colId, false);
        }

        function updateRollPosition(colId, smooth = true) {
            const drum = document.getElementById(`rollDrum${colId}`);
            const container = document.getElementById(`rollContainer${colId}`);
            const currentVal = state[currentMode][colId];
            const rangeMax = colId === 1 ? modesConfig[currentMode].max1 : modesConfig[currentMode].max2;
            
            const containerHeight = container.clientHeight || 130;
            const centerY = (containerHeight / 2) - (itemHeight / 2);
            const translateY = centerY - (currentVal * itemHeight);

            drum.style.transition = smooth ? 'transform 0.15s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
            drum.style.transform = `translateY(${translateY}px)`;

            for (let i = 0; i <= rangeMax; i++) {
                const el = document.getElementById(`item_${colId}_${i}`);
                if (el) {
                    if (i === currentVal) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                }
            }
        }

        function adjustValue(colId, delta) {
            const rangeMax = colId === 1 ? modesConfig[currentMode].max1 : modesConfig[currentMode].max2;
            let newVal = state[currentMode][colId] + delta;
            
            if (newVal >= 0 && newVal <= rangeMax) {
                state[currentMode][colId] = newVal;
                updateRollPosition(colId, true);
                resetSaveState();
            }
        }

        function setupSwipeRoll(colId) {
            const container = document.getElementById(`rollContainer${colId}`);
            let startY = 0;
            let isDragging = false;

            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                startY = e.touches[0].clientY;
                resetSaveState();
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                let currentY = e.touches[0].clientY;
                let deltaY = currentY - startY;
                
                if (Math.abs(deltaY) >= itemHeight / 2) {
                    let steps = Math.trunc(Math.abs(deltaY) / (itemHeight / 2));
                    let direction = deltaY > 0 ? 1 : -1;
                    
                    adjustValue(colId, direction * (steps > 0 ? 1 : 0));
                    startY = currentY;
                }
            }, { passive: true });

            container.addEventListener('touchend', () => {
                isDragging = false;
            }, { passive: true });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                let direction = e.deltaY > 0 ? 1 : -1;
                adjustValue(colId, direction);
            }, { passive: false });
        }

        function handleSave() {
            const btn = document.getElementById('saveBtn');
            btn.classList.remove('unclicked');
            btn.classList.add('clicked');
            btn.innerText = 'DATA BERHASIL DISIMPAN ✓';
            console.log(`[Mode: ${currentMode}] Tersimpan:`, state[currentMode]);
        }

        function resetSaveState() {
            const btn = document.getElementById('saveBtn');
            if (btn && btn.classList.contains('clicked')) {
                btn.classList.remove('clicked');
                btn.classList.add('unclicked');
                btn.innerText = 'SIMPAN DATA';
            }
        }

        // Inisialisasi awal
        switchMode('TB');
        setupSwipeRoll(1);
        setupSwipeRoll(2);
    </script>
</body>
</html>
