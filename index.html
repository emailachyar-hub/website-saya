<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Input Antropometri - Multi Mode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        /* HEADER BLUE BANNER */
        .header-banner {
            width: 100%;
            background: #0056b3;
            color: #ffffff;
            padding: 16px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* SECTION ANTREAN PASIEN & PASIEN SEDANG DIUKUR */
        .queue-section {
            width: 100%;
            padding: 14px 14px 8px 14px;
            background: #ffffff;
            color: #111827;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .queue-container {
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .queue-item:active {
            transform: scale(0.98);
        }

        /* TAMPILAN PENDING / MERAH */
        .queue-item.pending {
            background-color: #fce8e6;
            border: 2px solid #dc3545;
            color: #842029;
        }

        /* TAMPILAN SELESAI / HIJAU */
        .queue-item.selesai {
            background-color: #d1e7dd;
            border: 2px solid #198754;
            color: #0f5132;
        }

        /* TAMPILAN PASIEN AKTIF DIPILIH (SANGAT TERLIHAT) */
        .queue-item.selected-item {
            background-color: #e0f2fe !important; /* Latar biru muda terang */
            border: 3px solid #0284c7 !important; /* Border biru tebal */
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
        }

        .queue-patient-name {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }

        /* WARNA KHUSUS NAMA PASIEN YANG SEDANG AKTIF DIPILIH */
        .queue-item.selected-item .queue-patient-name {
            color: #0369a1 !important; /* Warna biru tua mencolok */
            font-size: 1.35rem; /* Ukuran sedikit lebih besar */
        }

        .badge-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            color: white;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-pending { background-color: #dc3545; }
        .badge-selesai { background-color: #198754; }

        /* CARD PASIEN SEDANG DIUKUR */
        .active-patient-card {
            background: #e3f2fd;
            border: 2px solid #0056b3;
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
        }

        .active-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #495057;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .active-name {
            font-size: 1.6rem;
            font-weight: 900;
            color: #0056b3;
            letter-spacing: 0.5px;
            margin-top: 2px;
            word-break: break-word;
        }

        /* Mode Selector Bar */
        .mode-bar {
            display: flex;
            width: 100%;
            background-color: #07090e;
            padding: 12px 10px;
            gap: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .btn-mode {
            flex: 1;
            padding: 10px 4px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
            position: relative;
        }

        .btn-mode .mode-label {
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mode-check-ic {
            font-size: 0.9rem;
            color: #22c55e;
            display: none;
        }

        .btn-mode.mode-saved .mode-check-ic {
            display: inline;
        }

        .btn-mode .mode-sub {
            font-size: 0.65rem;
            opacity: 0.8;
            margin-top: 2px;
            text-align: center;
        }

        .btn-mode.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .container {
            display: flex;
            width: 100%;
            flex: 1;
            min-height: 280px;
            overflow: hidden;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding: 10px;
            padding-bottom: 40px;
            border-right: 1px solid #1e293b;
            position: relative;
            touch-action: none;
            background: linear-gradient(180deg, #111827 0%, #0b0f19 100%);
        }

        .column:last-child {
            border-right: none;
        }

        .column-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .roll-container {
            position: relative;
            width: 90%;
            max-width: 220px;
            height: 130px;
            overflow: hidden;
            display: flex;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .roll-drum {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%;
            will-change: transform;
        }

        .roll-item {
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 700;
            color: #1e293b; 
            opacity: 0;
            pointer-events: none;
            width: 100%;
            transition: all 0.15s ease;
        }

        .roll-item.active {
            color: #38bdf8 !important; 
            opacity: 1 !important;
            font-size: 5.2rem; 
            letter-spacing: -2px;
            font-weight: 900;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.9), 0 0 50px rgba(56, 189, 248, 0.4);
        }

        .hint {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: 12px;
        }

        .footer-bar {
            width: 100%;
            padding: 20px;
            background-color: #07090e;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 1px solid #1e293b;
        }

        .btn-save {
            width: 100%;
            max-width: 700px;
            padding: 22px 20px; 
            font-size: 1.5rem;  
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.7);
            touch-action: manipulation;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
        }

        .btn-save:active {
            transform: scale(0.97);
        }

        .btn-save.unclicked {
            background-color: #ef4444; 
        }

        .btn-save.clicked {
            background-color: #22c55e; 
        }
    </style>
</head>
<body>

    <!-- HEADER BANNER -->
    <div class="header-banner">
        INPUT ANTROPOMETRI
    </div>

    <!-- ANTREAN & PASIEN DIAKTIFKAN -->
    <div class="queue-section">
        <div class="section-title">DAFTAR ANTREAN PASIEN:</div>
        
        <div class="queue-container" id="queueContainer">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>

        <div class="active-patient-card">
            <div class="active-label">PASIEN SEDANG DIUKUR:</div>
            <div class="active-name" id="displayNama">-- BELUM ADA DATA --</div>
        </div>
    </div>

    <!-- Pilihan Mode -->
    <div class="mode-bar">
        <button class="btn-mode active" id="btnModeTB" onclick="switchMode('TB')">
            <span class="mode-label">TB / PB <span class="mode-check-ic" id="checkTB">✓</span></span>
            <span class="mode-sub">Tinggi / Panjang</span>
        </button>
        <button class="btn-mode" id="btnModeBB" onclick="switchMode('BB')">
            <span class="mode-label">BB <span class="mode-check-ic" id="checkBB">✓</span></span>
            <span class="mode-sub">Berat Badan</span>
        </button>
        <button class="btn-mode" id="btnModeLP" onclick="switchMode('LP')">
            <span class="mode-label">LK <span class="mode-check-ic" id="checkLP">✓</span></span>
            <span class="mode-sub">Lingkar Kepala</span>
        </button>
    </div>

    <div class="container">
        <div class="column" id="col1">
            <div class="column-title" id="titleCol1">Cm</div>
            <div class="roll-container" id="rollContainer1">
                <div class="roll-drum" id="rollDrum1"></div>
            </div>
            <div class="hint">Swipe / Scroll</div>
        </div>

        <div class="column" id="col2">
            <div class="column-title" id="titleCol2">Mm</div>
            <div class="roll-container" id="rollContainer2">
                <div class="roll-drum" id="rollDrum2"></div>
            </div>
            <div class="hint">Swipe / Scroll</div>
        </div>
    </div>

    <div class="footer-bar">
        <button id="saveBtn" class="btn-save unclicked" onclick="handleSave()">SIMPAN DATA TB/PB</button>
    </div>

    <script>
        let antreanAntropometri = JSON.parse(localStorage.getItem('daftarAntropometri')) || [];
        let currentPatientId = localStorage.getItem('pasienAktifId') || null;
        let currentMode = 'TB';

        const modeLabels = {
            'TB': 'TB/PB',
            'BB': 'BB',
            'LP': 'LK'
        };

        const modesConfig = {
            'TB': { title1: 'Cm', title2: 'Mm', max1: 250, max2: 9 },
            'BB': { title1: 'Kg', title2: 'Ons', max1: 150, max2: 9 },
            'LP': { title1: 'Cm', title2: 'Mm', max1: 100, max2: 9 }
        };

        const state = {
            'TB': { 1: 50, 2: 0 },
            'BB': { 1: 3,  2: 0 },
            'LP': { 1: 35, 2: 0 }
        };

        const itemHeight = 130;

        function getSavedCount(patient) {
            if (!patient || !patient.dataUkuran) return 0;
            let count = 0;
            if (patient.dataUkuran['TB']?.saved) count++;
            if (patient.dataUkuran['BB']?.saved) count++;
            if (patient.dataUkuran['LP']?.saved) count++;
            return count;
        }

        function muatDaftarAntrean() {
            const container = document.getElementById('queueContainer');
            if (!container) return;
            container.innerHTML = '';

            // Jika antrean kosong, muat dari pasienAktif jika ada
            if (antreanAntropometri.length === 0) {
                const storedPasien = localStorage.getItem('pasienAktif');
                if (storedPasien) {
                    const data = JSON.parse(storedPasien);
                    const newEntry = {
                        id: Date.now().toString(),
                        nama: data.nama || 'PASIEN',
                        status: 'pending',
                        dataUkuran: {
                            'TB': { 1: 50, 2: 0, saved: false },
                            'BB': { 1: 3,  2: 0, saved: false },
                            'LP': { 1: 35, 2: 0, saved: false }
                        }
                    };
                    antreanAntropometri.push(newEntry);
                    localStorage.setItem('daftarAntropometri', JSON.stringify(antreanAntropometri));
                    currentPatientId = newEntry.id;
                    localStorage.setItem('pasienAktifId', currentPatientId);
                }
            }

            if (antreanAntropometri.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:10px; color:#6c757d; font-weight:bold;">Belum Ada Antrean Pasien</div>';
                document.getElementById('displayNama').innerText = '-- BELUM ADA DATA --';
                return;
            }

            antreanAntropometri.forEach(item => {
                const el = document.createElement('div');
                const savedCount = getSavedCount(item);
                const isSelesai = savedCount === 3 || item.status === 'selesai';
                
                el.className = `queue-item ${isSelesai ? 'selesai' : 'pending'}`;
                
                if (item.id === currentPatientId) {
                    el.classList.add('selected-item');
                }

                el.onclick = () => pilihPasien(item.id);

                let statusText = 'BELUM DISIMPAN';
                if (savedCount === 3) {
                    statusText = 'SUDAH DISIMPAN (3/3)';
                } else if (savedCount > 0) {
                    statusText = `${savedCount}/3 DISIMPAN`;
                }

                el.innerHTML = `
                    <div class="queue-patient-name">${item.nama.toUpperCase()}</div>
                    <span class="badge-status ${isSelesai ? 'badge-selesai' : 'badge-pending'}">
                        ${statusText}
                    </span>
                `;

                container.appendChild(el);
            });

            // Tampilkan nama pasien terpilih
            const activePasien = antreanAntropometri.find(p => p.id === currentPatientId) || antreanAntropometri[0];
            if (activePasien) {
                currentPatientId = activePasien.id;
                document.getElementById('displayNama').innerText = activePasien.nama.toUpperCase();
            }
        }

        function loadPatientDataToState() {
            const activePasien = antreanAntropometri.find(p => p.id === currentPatientId);
            if (activePasien && activePasien.dataUkuran) {
                ['TB', 'BB', 'LP'].forEach(m => {
                    if (activePasien.dataUkuran[m]) {
                        state[m][1] = activePasien.dataUkuran[m][1] ?? state[m][1];
                        state[m][2] = activePasien.dataUkuran[m][2] ?? state[m][2];
                    }
                });
            }
        }

        function updateModeBadges() {
            const activePasien = antreanAntropometri.find(p => p.id === currentPatientId);
            ['TB', 'BB', 'LP'].forEach(m => {
                const btn = document.getElementById(`btnMode${m}`);
                const isSaved = activePasien?.dataUkuran?.[m]?.saved;
                if (isSaved) {
                    btn?.classList.add('mode-saved');
                } else {
                    btn?.classList.remove('mode-saved');
                }
            });
        }

        function pilihPasien(id) {
            currentPatientId = id;
            localStorage.setItem('pasienAktifId', id);

            const p = antreanAntropometri.find(item => item.id === id);
            if (p) {
                localStorage.setItem('pasienAktif', JSON.stringify(p));
            }

            muatDaftarAntrean();
            loadPatientDataToState();
            switchMode(currentMode);
        }

        function switchMode(mode) {
            currentMode = mode;

            document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
            if (mode === 'TB') document.getElementById('btnModeTB').classList.add('active');
            if (mode === 'BB') document.getElementById('btnModeBB').classList.add('active');
            if (mode === 'LP') document.getElementById('btnModeLP').classList.add('active');

            document.getElementById('titleCol1').innerText = modesConfig[mode].title1;
            document.getElementById('titleCol2').innerText = modesConfig[mode].title2;

            loadPatientDataToState();
            initRoll(1);
            initRoll(2);
            updateButtonState();
            updateModeBadges();
        }

        function initRoll(colId) {
            const drum = document.getElementById(`rollDrum${colId}`);
            drum.innerHTML = '';
            
            const rangeMax = colId === 1 ? modesConfig[currentMode].max1 : modesConfig[currentMode].max2;

            for (let i = 0; i <= rangeMax; i++) {
                const div = document.createElement('div');
                div.className = `roll-item ${i === state[currentMode][colId] ? 'active' : ''}`;
                div.id = `item_${colId}_${i}`;
                div.innerText = i;
                drum.appendChild(div);
            }
            updateRollPosition(colId, false);
        }

        function updateRollPosition(colId, smooth = true) {
            const drum = document.getElementById(`rollDrum${colId}`);
            const container = document.getElementById(`rollContainer${colId}`);
            const currentVal = state[currentMode][colId];
            const rangeMax = colId === 1 ? modesConfig[currentMode].max1 : modesConfig[currentMode].max2;
            
            const containerHeight = container.clientHeight || 130;
            const centerY = (containerHeight / 2) - (itemHeight / 2);
            const translateY = centerY - (currentVal * itemHeight);

            drum.style.transition = smooth ? 'transform 0.15s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
            drum.style.transform = `translateY(${translateY}px)`;

            for (let i = 0; i <= rangeMax; i++) {
                const el = document.getElementById(`item_${colId}_${i}`);
                if (el) {
                    if (i === currentVal) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                }
            }
        }

        function adjustValue(colId, delta) {
            const rangeMax = colId === 1 ? modesConfig[currentMode].max1 : modesConfig[currentMode].max2;
            let newVal = state[currentMode][colId] + delta;
            
            if (newVal >= 0 && newVal <= rangeMax) {
                state[currentMode][colId] = newVal;
                updateRollPosition(colId, true);
                updateButtonState();
            }
        }

        function setupSwipeRoll(colId) {
            const container = document.getElementById(`rollContainer${colId}`);
            let startY = 0;
            let isDragging = false;

            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                startY = e.touches[0].clientY;
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                let currentY = e.touches[0].clientY;
                let deltaY = currentY - startY;
                
                if (Math.abs(deltaY) >= itemHeight / 2) {
                    let steps = Math.trunc(Math.abs(deltaY) / (itemHeight / 2));
                    let direction = deltaY > 0 ? 1 : -1;
                    
                    adjustValue(colId, direction * (steps > 0 ? 1 : 0));
                    startY = currentY;
                }
            }, { passive: true });

            container.addEventListener('touchend', () => {
                isDragging = false;
            }, { passive: true });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                let direction = e.deltaY > 0 ? 1 : -1;
                adjustValue(colId, direction);
            }, { passive: false });
        }

        function handleSave() {
            if (!currentPatientId || antreanAntropometri.length === 0) return;

            const index = antreanAntropometri.findIndex(p => p.id === currentPatientId);
            if (index !== -1) {
                if (!antreanAntropometri[index].dataUkuran) {
                    antreanAntropometri[index].dataUkuran = {};
                }

                // Simpan data spesifik untuk mode aktif
                antreanAntropometri[index].dataUkuran[currentMode] = {
                    1: state[currentMode][1],
                    2: state[currentMode][2],
                    saved: true
                };

                // Jika ketiga mode sudah tersimpan, tandai status utama pasien sebagai 'selesai'
                if (getSavedCount(antreanAntropometri[index]) === 3) {
                    antreanAntropometri[index].status = 'selesai';
                }

                localStorage.setItem('daftarAntropometri', JSON.stringify(antreanAntropometri));
                muatDaftarAntrean();
                updateButtonState();
                updateModeBadges();
            }
        }

        function updateButtonState() {
            const btn = document.getElementById('saveBtn');
            if (!btn) return;

            const activePasien = antreanAntropometri.find(p => p.id === currentPatientId);
            const label = modeLabels[currentMode];
            const isModeSaved = activePasien?.dataUkuran?.[currentMode]?.saved;

            if (isModeSaved) {
                btn.classList.remove('unclicked');
                btn.classList.add('clicked');
                btn.innerText = `DATA ${label} BERHASIL DISIMPAN ✓`;
            } else {
                btn.classList.remove('clicked');
                btn.classList.add('unclicked');
                btn.innerText = `SIMPAN DATA ${label}`;
            }
        }

        // Inisialisasi awal saat halaman dibuka
        window.onload = function() {
            muatDaftarAntrean();
            loadPatientDataToState();
            switchMode('TB');
            setupSwipeRoll(1);
            setupSwipeRoll(2);
        };
    </script>
</body>
</html>
