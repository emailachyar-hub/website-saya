<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Input Angka 2 Kolom (Single Active)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            width: 100%;
            flex: 1;
            overflow: hidden;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Memindahkan kotak ke area bawah */
            align-items: center;
            padding: 10px;
            padding-bottom: 30px; /* Jarak bawah */
            border-right: 1px solid #1e293b;
            position: relative;
            touch-action: none;
            background: linear-gradient(180deg, #111827 0%, #0b0f19 100%);
        }

        .column:last-child {
            border-right: none;
        }

        .column-title {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .roll-container {
            position: relative;
            width: 150px;
            height: 130px;
            overflow: hidden;
            display: flex;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .roll-drum {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%;
            will-change: transform;
        }

        .roll-item {
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            font-weight: 700;
            color: #1e293b; 
            opacity: 0;
            pointer-events: none;
            width: 100%;
            transition: all 0.15s ease;
        }

        .roll-item.active {
            color: #38bdf8 !important; 
            opacity: 1 !important;
            font-size: 6rem; 
            font-weight: 900;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.9), 0 0 50px rgba(56, 189, 248, 0.4);
        }

        .hint {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="column" id="col1">
            <div class="column-title">Kg</div>
            <div class="roll-container" id="rollContainer1">
                <div class="roll-drum" id="rollDrum1"></div>
            </div>
            <div class="hint">Swipe / Scroll</div>
        </div>

        <div class="column" id="col2">
            <div class="column-title">Ons</div>
            <div class="roll-container" id="rollContainer2">
                <div class="roll-drum" id="rollDrum2"></div>
            </div>
            <div class="hint">Swipe / Scroll</div>
        </div>
    </div>

    <script>
        const state = {
            1: 0,
            2: 0
        };

        const rangeMin = 0;
        const rangeMax = 500;
        const itemHeight = 130;

        function initRoll(colId) {
            const drum = document.getElementById(`rollDrum${colId}`);
            drum.innerHTML = '';
            for (let i = rangeMin; i <= rangeMax; i++) {
                const div = document.createElement('div');
                div.className = `roll-item ${i === state[colId] ? 'active' : ''}`;
                div.id = `item_${colId}_${i}`;
                div.innerText = i;
                drum.appendChild(div);
            }
            updateRollPosition(colId, false);
        }

        function updateRollPosition(colId, smooth = true) {
            const drum = document.getElementById(`rollDrum${colId}`);
            const container = document.getElementById(`rollContainer${colId}`);
            const currentVal = state[colId];
            const offsetIndex = currentVal - rangeMin;
            
            const containerHeight = container.clientHeight || 130;
            const centerY = (containerHeight / 2) - (itemHeight / 2);
            const translateY = centerY - (offsetIndex * itemHeight);

            drum.style.transition = smooth ? 'transform 0.15s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
            drum.style.transform = `translateY(${translateY}px)`;

            for (let i = rangeMin; i <= rangeMax; i++) {
                const el = document.getElementById(`item_${colId}_${i}`);
                if (el) {
                    if (i === currentVal) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                }
            }
        }

        function adjustValue(colId, delta) {
            let newVal = state[colId] + delta;
            if (newVal >= rangeMin && newVal <= rangeMax) {
                state[colId] = newVal;
                updateRollPosition(colId, true);
            }
        }

        function setupSwipeRoll(colId) {
            const container = document.getElementById(`rollContainer${colId}`);
            let startY = 0;
            let isDragging = false;

            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                startY = e.touches[0].clientY;
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                let currentY = e.touches[0].clientY;
                let deltaY = currentY - startY;
                
                if (Math.abs(deltaY) >= itemHeight / 2) {
                    let steps = Math.trunc(Math.abs(deltaY) / (itemHeight / 2));
                    // Logika diubah: Swipe ke bawah (deltaY > 0) = angka NAIK (positif 1)
                    let direction = deltaY > 0 ? 1 : -1;
                    
                    adjustValue(colId, direction * (steps > 0 ? 1 : 0));
                    startY = currentY;
                }
            }, { passive: true });

            container.addEventListener('touchend', () => {
                isDragging = false;
            }, { passive: true });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                // Scroll ke bawah = angka NAIK
                let direction = e.deltaY > 0 ? 1 : -1;
                adjustValue(colId, direction);
            }, { passive: false });
        }

        initRoll(1);
        initRoll(2);
        setupSwipeRoll(1);
        setupSwipeRoll(2);
    </script>
</body>
</html>
